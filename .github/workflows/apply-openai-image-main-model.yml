name: Apply OpenAI Image Main Model Wiring

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-openai-image-main-model.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply exact Images OAuth wiring change
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("backend/internal/service/openai_images_responses.go")
          text = path.read_text(encoding="utf-8")
          old = '''\ttoken, _, err := s.GetAccessToken(upstreamCtx, account)
          \tif err != nil {
          \t\treturn nil, err
          \t}

          \tresponsesBody, err := buildOpenAIImagesResponsesRequest(parsed, requestModel)
          \tif err != nil {
          \t\treturn nil, err
          \t}
          '''
          new = '''\ttoken, _, err := s.GetAccessToken(upstreamCtx, account)
          \tif err != nil {
          \t\treturn nil, err
          \t}

          \tresponsesMainModel, err := s.resolveOpenAIImagesResponsesMainModel(upstreamCtx, account)
          \tif err != nil {
          \t\treturn nil, err
          \t}
          \tresponsesBody, err := buildOpenAIImagesResponsesRequestForMainModel(parsed, responsesMainModel, requestModel)
          \tif err != nil {
          \t\treturn nil, err
          \t}
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one Images OAuth call-site match, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          gofmt -w backend/internal/service/openai_images_responses.go

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run targeted OpenAI OAuth image tests
        working-directory: backend
        run: >-
          go test -tags=unit ./internal/service
          -run 'Test(ExtractOpenAICodexManifestModelIDs|SelectOpenAICodexImageMainModel|OpenAICodexImageGenerationEligible|BuildOpenAIImagesResponsesRequestForMainModel|FetchUpstreamSupportedModelsOpenAIOAuth.*|ResolveOpenAIImagesResponsesMainModelUsesManifestPriority)'
          -count=1

      - name: Commit exact wiring change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/service/openai_images_responses.go
          git diff --cached --exit-code && exit 0
          git commit -m "fix(openai): use dynamic Codex main model for images"
          git push origin HEAD:main
