name: Security Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.6'
      - name: Run govulncheck
        working-directory: backend
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -format json ./... > govulncheck.json
          allowed='["GO-2026-6166","GO-2026-6168","GO-2026-6169","GO-2026-6170","GO-2026-6171","GO-2026-6172","GO-2026-6173"]'
          unexpected="$(jq -r -s --argjson allowed "$allowed" '
            [
              .[]
              | select(.finding != null and .finding.trace[0].function != null)
              | .finding as $finding
              | $finding.osv as $id
              | select(
                  ($finding.trace[0].module != "github.com/lib/pq")
                  or (($allowed | index($id)) == null)
                )
              | $id
            ]
            | unique
            | .[]
          ' govulncheck.json)"
          if [[ -n "$unexpected" ]]; then
            echo "Unapproved reachable vulnerabilities:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          echo "Only explicitly tracked lib/pq vulnerabilities without an upstream fix were found."

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        working-directory: frontend
        run: |
          pnpm audit --prod --audit-level=high --json > audit.json || true
      - name: Check audit exceptions
        run: |
          python tools/check_pnpm_audit_exceptions.py \
            --audit frontend/audit.json \
            --exceptions .github/audit-exceptions.yml
