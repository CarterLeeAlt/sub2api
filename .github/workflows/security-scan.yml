name: Security Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.4'
      - name: Run govulncheck
        working-directory: backend
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -format json ./... > govulncheck.json
          allowed='["GO-2026-6166","GO-2026-6168","GO-2026-6169","GO-2026-6170","GO-2026-6171","GO-2026-6172","GO-2026-6173"]'
          unexpected="$(jq -r -s --argjson allowed "$allowed" '
            [
              .[]
              | select(.finding != null and .finding.trace[0].function != null)
              | .finding as $finding
              | $finding.osv as $id
              | select(
                  ($finding.trace[0].module != "github.com/lib/pq")
                  or (($allowed | index($id)) == null)
                )
              | $id
            ]
            | unique
            | .[]
          ' govulncheck.json)"
          if [[ -n "$unexpected" ]]; then
            echo "Unapproved reachable vulnerabilities:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          echo "Only explicitly tracked lib/pq vulnerabilities without an upstream fix were found."

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache isolated frontend tools and dependencies
        uses: actions/cache@v6
        with:
          path: |
            .toolchains/node-*
            .toolchains/pnpm-*
            .cache/security-scan-fix/pnpm-store
          key: frontend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package.json', 'frontend/pnpm-lock.yaml', 'frontend/pnpm-workspace.yaml', 'frontend/.npmrc', 'tools/frontend.*') }}
      - name: Setup isolated frontend toolchain
        run: pwsh -NoProfile -File tools/frontend.ps1 setup
      - name: Install dependencies
        run: pwsh -NoProfile -File tools/frontend.ps1 install --frozen-lockfile
      - name: Run pnpm audit
        run: |
          pwsh -NoProfile -File tools/frontend.ps1 audit --prod --audit-level=high --json > frontend/audit.json || true
      - name: Check audit exceptions
        run: |
          python tools/check_pnpm_audit_exceptions.py \
            --audit frontend/audit.json \
            --exceptions .github/audit-exceptions.yml
